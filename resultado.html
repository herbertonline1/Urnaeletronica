<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apuração de Votos - Urna Eletrônica</title>
    <link rel="stylesheet" href="styles/style.css" type="text/css">
    <style>
        .resultado-container {
            width: 90%;
            max-width: 650px;
            background-color: var(--fundo);
            padding: 25px;
            border-radius: 10px;
            font-family: var(--font);
            color: var(--botoes);
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
        }

        .resultado-header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--fundo-botoes);
            padding-bottom: 10px;
        }

        .item-candidato {
            background-color: var(--branco);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .candidato-info {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 16px;
        }

        .barra-progresso-bg {
            width: 100%;
            height: 18px;
            background-color: #e0e0e0;
            border-radius: 9px;
            overflow: hidden;
        }

        .barra-progresso-fill {
            height: 100%;
            background-color: #60BC4F;
            width: 0%;
            transition: width 0.5s ease-in-out;
        }

        .total-votos {
            text-align: right;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
        }

        .btn-voltar {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: var(--fundo-botoes);
            color: var(--branco);
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div id="container">

        <div class="resultado-container">
            <div class="resultado-header">
                <h2>APURAÇÃO DOS VOTOS</h2>
                <p>Acompanhamento em tempo real</p>
            </div>

            <div id="listaResultados">
                <div class="item-candidato">
                    <div class="candidato-info">
                        <span>LULA (PT - 13)</span>
                        <span id="votos-13">0 votos (0%)</span>
                    </div>
                    <div class="barra-progresso-bg">
                        <div id="bar-13" class="barra-progresso-fill"></div>
                    </div>
                </div>

                <div class="item-candidato">
                    <div class="candidato-info">
                        <span>BOLSONARO (PSL - 22)</span>
                        <span id="votos-22">0 votos (0%)</span>
                    </div>
                    <div class="barra-progresso-bg">
                        <div id="bar-22" class="barra-progresso-fill"></div>
                    </div>
                </div>

                <div class="item-candidato">
                    <div class="candidato-info">
                        <span>VOTOS BRANCOS</span>
                        <span id="votos-BRANCO">0 votos (0%)</span>
                    </div>
                    <div class="barra-progresso-bg">
                        <div id="bar-BRANCO" class="barra-progresso-fill" style="background-color: #a0a0a0;"></div>
                    </div>
                </div>

                <div class="item-candidato">
                    <div class="candidato-info">
                        <span>VOTOS NULOS</span>
                        <span id="votos-NULO">0 votos (0%)</span>
                    </div>
                    <div class="barra-progresso-bg">
                        <div id="bar-NULO" class="barra-progresso-fill" style="background-color: #FC8102;"></div>
                    </div>
                </div>
            </div>

            <div class="total-votos">
                Total de Votos: <span id="totalVotos">0</span>
            </div>

            <a href="index.html" class="btn-voltar">Voltar para a Urna</a>
        </div>

        <footer>
            <p>Dev. Guedes</p>
            <a href="https://github.com/pauloguedes96">
                <img src="./images/GitHub-Mark-32px.png" alt="">
            </a>
        </footer>

    </div>

    <script type="module" src="./resultado.js"></script>
</body>

</html>
